name: Release

on:
  push:
    tags: ["v*"]
  # A dry run for changes to the release pipeline: build the DMG and attach it
  # to the run, without publishing anything.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bundle.sh
      - scripts/dmg/**

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the app for Apple silicon and Intel
        run: scripts/bundle.sh -c release --arch arm64 --arch x86_64

      - name: Make the DMG
        # The window layout is in scripts/dmg/settings.py. pipx runs a pinned dmgbuild
        # without installing it into the runner's Python.
        run: pipx run --spec dmgbuild==1.6.7 dmgbuild -s scripts/dmg/settings.py -D app=.build/iMiqaat.app iMiqaat "iMiqaat-${VERSION#v}.dmg"

      - name: Attach the DMG to this run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: iMiqaat-dmg
          path: iMiqaat-*.dmg

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's changelog section, without its heading. It ends at the next
          # heading or at the link references (`[0.1.0]: …`) at the end of the file.
          awk -v v="${VERSION#v}" '$0 ~ "^## \\[" v "\\]" { on = 1; next } /^(## )?\[/ { on = 0 } on' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ## Installing

          This build is ad-hoc signed and not notarized by Apple, so macOS stops it the first time you open it:

          1. Open the DMG and drag **iMiqaat** to **Applications**.
          2. Open iMiqaat. When macOS says it can't verify the developer, click **Done**.
          3. Open **System Settings › Privacy & Security**, scroll down and click **Open Anyway** next to iMiqaat.
          EOF
          # shortcut: every release is a pre-release until builds are notarized (v1.0).
          gh release create "$VERSION" "iMiqaat-${VERSION#v}.dmg" \
            --title "iMiqaat ${VERSION#v}" --notes-file notes.md --prerelease

      - name: Update the Homebrew cask
        if: github.ref_type == 'tag'
        env:
          # A fine-grained token with Contents read/write on u-sm/homebrew-tap only.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN isn't set, so the Homebrew cask wasn't updated."
            exit 0
          fi
          sha256=$(shasum -a 256 "iMiqaat-${VERSION#v}.dmg" | cut -d ' ' -f 1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/u-sm/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION#v}\"/; s/^  sha256 \".*\"/  sha256 \"${sha256}\"/" Casks/imiqaat.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "imiqaat ${VERSION#v}"
          git push
